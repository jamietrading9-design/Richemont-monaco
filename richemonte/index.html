<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>In Arbeit | Richemont Monaco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo {
            font-family: 'Great Vibes', cursive;
            font-size: 70px; 
            margin-bottom: 20px;
            display: block;
            text-decoration: none;
            color: #fff;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #444;
            margin: 0 auto 40px;
        }

        h1 {
            font-size: 16px; 
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 20px;
        }

        p {
            font-size: 13px; 
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .cta-button {
            display: inline-block;
            padding: 12px 25px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background: #fff;
            color: #000;
        }

        @media (max-width: 480px) {
            .logo { font-size: 50px; }
            h1 { font-size: 13px; letter-spacing: 4px; }
            p { font-size: 11px; }
            .cta-button { font-size: 10px; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="https://richemont-monaco.netlify.app" class="logo">Richemont Monaco</a>
        
        <div class="divider"></div>
        
        <h1>Diese Seite ist in Arbeit</h1>
        
        <p>
            Wir bereiten diesen Bereich aktuell vor.<br>
            Besuchen Sie in der Zwischenzeit unsere neue Website:
        </p>

        <a href="https://richemont-monaco.netlify.app" class="cta-button">Zur Website</a>
    </div>

</body>
</html>
